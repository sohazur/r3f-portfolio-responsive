[build]
  command = "npm run check && npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "https://sohazur.com/:splat"
  status = 301
  force = true
  conditions = { Host = ["www.sohazur.com"] }

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
